<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>RG-Designs — Design brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>html,body{background:#0e0e0e;color:#f0ede8;font-family:Cairo,system-ui,sans-serif;margin:0}#boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}#boot b{color:#C9A84C;letter-spacing:1px;font-size:18px}#boot .sp{width:28px;height:28px;border:3px solid #2e2e2e;border-top-color:#C9A84C;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}#boot p{color:#8d877f;margin:0;max-width:420px}</style>
</head>
<body>
<div id="boot"><b>RG-DESIGNS</b><div class="sp"></div><p></p></div>
<!-- brief.rg-designs.net = this file as index.html AND 404.html (GitHub Pages serves 404.html for /<name>-<suffix>); the page itself comes from the CRM server -->
<script>window.RGB={"api":"https://pdc.tail951c24.ts.net/s/b","lang":"ar"};</script>
<script src="https://pdc.tail951c24.ts.net/s/b/_app.js" onerror="(function(){var b=document.getElementById('boot');var s=b.querySelector('.sp');if(s)s.remove();b.querySelector('p').textContent='مفيش اتصال بالسيرفر دلوقتي — جرّبوا تاني بعد شوية · Cannot reach the server right now, please try again shortly';})()"></script>
</body>
